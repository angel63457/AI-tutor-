<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ИИ Репетитор</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --panel: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --accent: #22c55e;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dbe3f0;
        --warning: #fef3c7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 12px 30px rgba(79, 70, 229, 0.25);
      }

      .hero h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .hero p {
        margin: 0;
        max-width: 700px;
        font-size: 1.05rem;
        line-height: 1.6;
        opacity: 0.95;
      }

      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 24px;
        margin-top: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      }

      .subject-list {
        padding: 18px;
      }

      .subject-button {
        width: 100%;
        text-align: left;
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .subject-button.active {
        background: #eef2ff;
        border-color: rgba(79, 70, 229, 0.4);
        color: var(--primary-dark);
        box-shadow: inset 0 0 0 1px rgba(79, 70, 229, 0.2);
      }

      .chat-panel {
        padding: 20px;
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .chat-header h2 {
        margin: 0;
        font-size: 1.4rem;
      }

      .badge {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .chat-box {
        height: 340px;
        overflow-y: auto;
        padding: 12px;
        background: #f8fafc;
        border-radius: 16px;
        border: 1px solid var(--border);
      }

      .message {
        margin: 10px 0;
        padding: 12px 14px;
        border-radius: 14px;
        max-width: 85%;
        line-height: 1.5;
        white-space: pre-line;
      }

      .message.user {
        margin-left: auto;
        background: #e0e7ff;
        color: #1f2937;
      }

      .message.bot {
        background: #ffffff;
        border: 1px solid var(--border);
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
      }

      button.send {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      button.send:hover {
        background: var(--primary-dark);
      }

      .examples-box {
        margin-top: 24px;
        padding: 18px;
      }

      .examples-box h3 {
        margin-top: 0;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .example-card {
        background: #f8fafc;
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: 14px;
      }

      .example-card strong {
        display: block;
        margin-bottom: 8px;
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .input-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <h1>ИИ Репетитор</h1>
        <p>
          Поддержка по математике, русскому языку и программированию. Задай вопрос,
          выбери предмет и получи понятное объяснение с примером.
        </p>
      </header>

      <main class="layout">
        <aside class="panel subject-list" aria-label="Выбор предмета">
          <button class="subject-button active" data-subject="math">Математика</button>
          <button class="subject-button" data-subject="russian">Русский язык</button>
          <button class="subject-button" data-subject="programming">Программирование</button>
        </aside>

        <section class="panel chat-panel">
          <div class="chat-header">
            <h2 id="subjectTitle">Математика</h2>
            <span class="badge">Онлайн</span>
          </div>

          <div id="chatBox" class="chat-box" aria-live="polite"></div>

          <div class="input-row">
            <input id="userInput" type="text" placeholder="Например: реши уравнение 2x + 3 = 7" />
            <button class="send" id="sendButton">Отправить</button>
          </div>
        </section>
      </main>

      <section class="panel examples-box">
        <h3>Примеры вопросов</h3>
        <div class="examples" id="examplesContainer"></div>
      </section>
    </div>

    <script>
      const subjectData = {
        math: {
          title: 'Математика',
          examples: [
            'Реши уравнение 2x + 3 = 7',
            'Что такое проценты?',
            'Как найти площадь прямоугольника?'
          ],
          starter: 'Привет! Я помогу с математикой. Напиши задачу или вопрос, и я объясню по шагам.'
        },
        russian: {
          title: 'Русский язык',
          examples: [
            'Объясни правило "жи-ши"',
            'Что такое однородные члены?',
            'Как отличить причастный оборот?'
          ],
          starter: 'Привет! Я помогу с русским языком: правила, разборы, орфография и пунктуация.'
        },
        programming: {
          title: 'Программирование',
          examples: [
            'Объясни цикл for',
            'Как работает Python?',
            'Напиши код для калькулятора'
          ],
          starter: 'Привет! Я помогу с программированием: Python, JavaScript, алгоритмы и логика.'
        }
      };

      const subjects = document.querySelectorAll('.subject-button');
      const chatBox = document.getElementById('chatBox');
      const userInput = document.getElementById('userInput');
      const sendButton = document.getElementById('sendButton');
      const examplesContainer = document.getElementById('examplesContainer');
      const subjectTitle = document.getElementById('subjectTitle');

      let currentSubject = 'math';

      function renderExamples(subject) {
        const examples = subjectData[subject].examples;
        examplesContainer.innerHTML = examples
          .map(
            (item) => `
              <div class="example-card">
                <strong>${item}</strong>
                <span>Нажмите, чтобы попробовать</span>
              </div>
            `
          )
          .join('');

        examplesContainer.querySelectorAll('.example-card').forEach((card, index) => {
          card.addEventListener('click', () => {
            const text = examples[index];
            userInput.value = text;
            userInput.focus();
          });
        });
      }

      function addMessage(text, sender) {
        const message = document.createElement('div');
        message.className = `message ${sender}`;
        message.innerHTML = `<strong>${sender === 'user' ? 'Ты' : 'ИИ'}:</strong><br>${text}`;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function getReply(subject, question) {
        const q = question.toLowerCase();

        if (subject === 'math') {
          if (q.includes('урав') || q.includes('реши')) {
            return 'Чтобы решить уравнение, нужно перенести известные числа в одну сторону, а переменные — в другую. Например: 2x + 3 = 7 → 2x = 4 → x = 2. Всегда проверяй ответ подстановкой.';
          }
          if (q.includes('процент')) {
            return 'Процент — это одна сотая часть числа. Например, 25% от 200 = 200 × 25 / 100 = 50. Для расчёта: часть = число × процент / 100.';
          }
          if (q.includes('площад') || q.includes('прямоуголь')) {
            return 'Площадь прямоугольника равна произведению длины на ширину: S = a × b. Например, если a = 5, b = 3, то S = 15.';
          }
          return 'Математика строится на логике и правилах. Попробуй сформулировать задачу точнее: уравнение, дроби, проценты, геометрия или алгебра. Я помогу по шагам.';
        }

        if (subject === 'russian') {
          if (q.includes('жи') || q.includes('ши')) {
            return 'Правило: в словах пишется "жи" и "ши" через "и": жить, шишка, жизнь. Исключения есть, но в большинстве слов это правило работает.';
          }
          if (q.includes('однород') || q.includes('члены')) {
            return 'Однородные члены отвечают на один и тот же вопрос и относятся к одному слову. Например: "В саду росли яблоки, груши, вишни". Они обычно соединяются перечислительной интонацией.';
          }
          if (q.includes('причаст') || q.includes('оборот')) {
            return 'Причастный оборот — это причастие с зависимыми словами. Он обычно выделяется запятыми, если стоит после определения. Например: "Дом, построенный братом, стоял рядом".';
          }
          return 'В русском языке важно смотреть на правило, слово, вопрос и контекст. Если хочешь, я могу объяснить орфографию, пунктуацию или разбор предложения.';
        }

        if (subject === 'programming') {
          if (q.includes('for') || q.includes('цикл')) {
            return 'Цикл for выполняется заданное число раз. В Python: for i in range(5): print(i). Он проходит значения 0, 1, 2, 3, 4.';
          }
          if (q.includes('python') || q.includes('пайтон')) {
            return 'Python — простой и читабельный язык. Он подходит для задач, анализа данных, автоматизации и веба. Основные блоки: переменные, функции, циклы и условия.';
          }
          if (q.includes('калькулятор')) {
            return 'Вот простая версия на Python:\n\nnum1 = float(input("Первое число: "))\nnum2 = float(input("Второе число: "))\nop = input("Операция (+, -, *, /): ")\n\nif op == "+":\n    print(num1 + num2)\nelif op == "-":\n    print(num1 - num2)\n# и так далее';
          }
          return 'Программирование — это логика и алгоритмы. Я могу объяснить переменные, условия, циклы, функции или помочь написать код по задаче.';
        }

        return 'Я не совсем понял тему. Выбери предмет: математика, русский или программирование.';
      }

      function handleSend() {
        const question = userInput.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        userInput.value = '';

        const reply = getReply(currentSubject, question);

        setTimeout(() => {
          addMessage(reply, 'bot');
        }, 400);
      }

      subjects.forEach((button) => {
        button.addEventListener('click', () => {
          currentSubject = button.dataset.subject;
          subjectTitle.textContent = subjectData[currentSubject].title;
          subjects.forEach((el) => el.classList.toggle('active', el === button));

          const initial = subjectData[currentSubject].starter;
          chatBox.innerHTML = '';
          addMessage(initial, 'bot');
          renderExamples(currentSubject);
        });
      });

      sendButton.addEventListener('click', handleSend);
      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          handleSend();
        }
      });

      renderExamples(currentSubject);
      addMessage(subjectData[currentSubject].starter, 'bot');
    </script>
  </body>
</html>
